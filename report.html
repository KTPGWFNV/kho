<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DATA NHẬP XUẤT</title>
<link rel="icon" type="image/png" href="icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>

/* ======================
   BODY
====================== */

body{
font-family:Arial;
padding:10px;
background:#f5f5f5;
}


/* ======================
   LOGIN
====================== */

#loginPage{
max-width:350px;
margin:auto;
margin-top:120px;
}

.loginBox{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.2);
text-align:center;
}

.loginBox input{
width:90%;
padding:8px;
margin:6px;
}

.loginBox button{
padding:8px 16px;
margin-top:8px;
background:#0984e3;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.loginBox button:hover{
background:#0864b1;
}
.statBox{
width:700px;
margin:0 auto 12px auto;
background:white;
padding:10px;
border-radius:8px;
box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

#statTable{
width:700px;
border-collapse:collapse;
}

#statTable th,
#statTable td{
padding:8px 4px;
font-size:14px;
}
/* ======================
   BOX
====================== */

.box{
background:white;
padding:10px;
margin-bottom:10px;
border-radius:8px;
box-shadow:0 2px 6px rgba(0,0,0,0.15);
}


/* ======================
   HEADER FIXED
====================== */

.headerFixed{
position:sticky;
top:0;
z-index:999;
background:#f5f5f5;
padding-bottom:5px;
}


/* ======================
   TABLE
====================== */

.tableWrap{
max-height:70vh;
overflow-y:auto;
}

.tableWrap th{
position:sticky;
top:0;
z-index:5;
}
#tableTon th,
#tableNhap th,
#tableXuat th{
background: linear-gradient(135deg, #2d3436, #636e72) !important;
color: #fff !important;
font-weight: bold;
}
table{
border-collapse:collapse;
width:100%;
}

th,td{
border:1px solid #ccc;
padding:6px;
text-align:center;
}

tr:nth-child(even){
background:#fafafa;
}
th{
background: linear-gradient(135deg, #6c5ce7, #0984e3);
color: white;
font-weight: bold;
text-transform: uppercase;
padding:8px;
border:1px solid #ddd;
}

th:first-child{
border-top-left-radius:8px;
}

th:last-child{
border-top-right-radius:8px;
}
#statTable th{
background: linear-gradient(135deg, #00b894, #55efc4);
color: #003d2e;
font-size: 14px;
}
th:hover{
opacity:0.9;
}
#tableBaoCao .tongRow{
  position: sticky;
  bottom: 0;
  z-index: 5;
  background: #ffeaa7 !important;
}

#tableBaoCao .tongRow td{
  background: #ffeaa7 !important;
  font-weight:bold;
}/* ======================
   TAB
====================== */

.tab{
display:none;
}

.tab.active{
display:block;
}

.tabBtn{
padding:8px 16px;
margin:5px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
background:#dfe6e9;
}

.tabBtn.active{
background:#0984e3;
color:white;
}


/* ======================
   LOADING
====================== */

.loading{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#fdcb6e;
padding:15px 25px;
border-radius:10px;
font-weight:bold;
display:none;
}

</style>

</head>

<body>

<!-- ======================
       LOGIN
====================== -->

<div id="loginPage">

<div class="loginBox">

<h2>🔐 Đăng nhập</h2>

<input id="username"
placeholder="Tên đăng nhập">

<input id="password"
type="password"
placeholder="Mật khẩu">

<br>

<button onclick="login()">
Đăng nhập
</button>

</div>

</div>


<!-- ======================
       MAIN APP
====================== -->

<div id="mainApp" style="display:none;">


<div class="headerFixed box">

<button class="tabBtn"
onclick="showTab('nhap',this)">
📥 Dữ liệu nhập
</button>

<button class="tabBtn"
onclick="showTab('xuat',this)">
📤 Dữ liệu xuất
</button>

<button class="tabBtn"
onclick="showTab('ton',this)">
📦 Tồn
</button>

<button class="tabBtn"
onclick="showTab('baocao',this)">
📊 Báo cáo
</button>

<button onclick="loadAllData()">
🔄 Load dữ liệu
</button>

<button onclick="logout()">
🚪 Logout
</button>

</div>


<div id="loading" class="loading">
⏳ Đang load dữ liệu...
</div>


<!-- ======================
       TAB NHẬP
====================== -->

<div id="nhap" class="tab">

<div class="box">

<h2>📥 DATA NHẬP</h2>

<button onclick="downloadExcel(dataNhap,'DATA_NHAP')">
⬇️ Tải Excel
</button>

<h3 id="totalNhap">
Tổng thùng: 0
</h3>

<div class="tableWrap">
<table id="tableNhap"></table>
</div>

</div>
</div>

<!-- ======================
       TAB XUẤT
====================== -->

<div id="xuat" class="tab">

<div class="box">

<h2>📤 DATA XUẤT</h2>
<button onclick="downloadExcel(dataXuat,'DATA_XUAT')">
⬇️ Tải Excel
</button>

<h3 id="totalXuat">
Tổng thùng: 0
</h3>

<div class="tableWrap">
<table id="tableXuat"></table>
</div>

</div>

</div>


<!-- ======================
       TAB TỒN
====================== -->

<div id="ton" class="tab">

  <div class="box">

    <h2>📦 HÀNG TỒN</h2>

    <button onclick="downloadExcel(getTonData(),'DATA_TON')">
      ⬇️ Tải Excel
    </button>

    <h3 id="totalTon">
      Tổng thùng tồn: 0
    </h3>

    <div class="tableWrap">
      <table id="tableTon"></table>
    </div>

  </div>
</div> <!-- 👈 ĐÓNG TAB TỒN Ở ĐÂY -->


<!-- ✅ TAB BÁO CÁO (ĐẶT NGOÀI) -->
<div id="baocao" class="tab">
  <div class="box">
    <h2>📊 BÁO CÁO</h2>

 <div class="statBox">
  <table id="statTable"></table>
</div>
<input
id="searchBaoCao"
type="text"
placeholder="🔍 Tìm mã hoặc tên hàng..."
style="
width:300px;
padding:8px;
margin-bottom:10px;
border:1px solid #ccc;
border-radius:6px;
"
oninput="renderBaoCao()"
>
<label style="margin-left:10px;">
  <input type="checkbox" id="showHetTon"
  onchange="renderBaoCao()">
  Hiện mã hết tồn
</label>
<button onclick="downloadBaoCaoExcel()">
⬇️ Tải Excel
</button>

    <div class="tableWrap">
      <table id="tableBaoCao"></table>
    </div>
  </div>
</div>
<script>
// ======================
// USERS LOGIN
// ======================

let users=[

{
username:"admin",
password:"123456"
},

{
username:"user",
password:"123456"
}

];


// ======================
// LOGIN
// ======================

function login(){

let u=
document.getElementById("username").value;

let p=
document.getElementById("password").value;

let found=
users.find(x=>
x.username===u &&
x.password===p
);

if(!found){

alert("Sai tài khoản!");

return;

}

document.getElementById("loginPage")
.style.display="none";

document.getElementById("mainApp")
.style.display="block";

showTab(
"nhap",
document.querySelector(".tabBtn")
);
loadAllData();
}

// ======================
// TÍNH HÀNG TỒN
// ======================

function renderBaoCao(){

let tonData = getTonData();   // tồn
let nhapData = dataNhap;
let xuatData = dataXuat;

let table = document.getElementById("tableBaoCao");
table.innerHTML = "";

// HEADER
let cols = [
"MÃ HÀNG","TÊN HÀNG",
"BOX VN","BOX TQ","BOX HQ",

"NHẬP TQ","NHẬP HQ","TỔNG NHẬP",

"XUẤT TQ","XUẤT HQ","TỔNG XUẤT",

"TỒN TQ","TỒN HQ",
"TỔNG TỒN"
];

let header = table.insertRow();
cols.forEach(c=>{
let th = document.createElement("th");
th.innerText = c;
header.appendChild(th);
});

// ===== MAP =====
let map = {};
let idCount = {};

let keyword =
document.getElementById("searchBaoCao")?.value
.toLowerCase()
.trim() || "";

tonData.forEach(row=>{
  idCount[row.id] = (idCount[row.id] || 0) + 1;
});
function addData(data,type){

data.forEach(row=>{

let key = row.ma;
let note = (row.note||"").toUpperCase();

let qty = Object.values(row.sizes||{})
.reduce((a,b)=>a+(Number(b)||0),0);

if(!map[key]){
map[key] = {
ten: row.ten,

boxVN:new Set(),
boxTQ:new Set(),
boxHQ:new Set(),

nhapTQ:0, nhapHQ:0,
xuatTQ:0, xuatHQ:0
};
}

if(type==="TON"){

  // 🔥 bỏ thùng MIX (ID có nhiều dòng)
  if(idCount[row.id] > 1) return;

  if(note.includes("CHINA")){
    map[key].boxTQ.add(row.id);
  }
  else if(note.includes("VIET")){
    map[key].boxVN.add(row.id);
  }
  else{
    map[key].boxHQ.add(row.id);
  }

}// ===== NHẬP
if(type==="NHAP"){
if(note.includes("CHINA") || note.includes("VIET")){
map[key].nhapTQ += qty;
}else{
map[key].nhapHQ += qty;
}
}

// ===== XUẤT
if(type==="XUAT"){
if(note.includes("CHINA") || note.includes("VIET")){
map[key].xuatTQ += qty;
}else{
map[key].xuatHQ += qty;
}
}

});
}

// chạy
addData(tonData,"TON");
addData(nhapData,"NHAP");
addData(xuatData,"XUAT");

// ===== RENDER =====

let totalSum = {
boxVN:0,
boxTQ:0,
boxHQ:0,

tongNhap:0,
tongXuat:0,

tonTQ:0,
tonHQ:0,
total:0
};

Object.entries(map)
.sort((a,b)=> a[0].localeCompare(b[0], 'vi'))
.forEach(([ma,x])=>{

if(
!ma.toLowerCase().includes(keyword) &&
!x.ten.toLowerCase().includes(keyword)
){
return;
}
// 🔥 bỏ dòng không có thùng
let showHetTon =
document.getElementById("showHetTon")?.checked;

if(
!showHetTon &&
x.boxVN.size === 0 &&
x.boxTQ.size === 0 &&
x.boxHQ.size === 0
){
  return;
}
let tonTQ = x.nhapTQ - x.xuatTQ;
let tonHQ = x.nhapHQ - x.xuatHQ;
let total = tonTQ + tonHQ;
let tongNhap = x.nhapTQ + x.nhapHQ;
let tongXuat = x.xuatTQ + x.xuatHQ;
let r = table.insertRow();

r.insertCell().innerText = ma;
r.insertCell().innerText = x.ten;

r.insertCell().innerText = x.boxVN.size || "";
r.insertCell().innerText = x.boxTQ.size || "";
r.insertCell().innerText = x.boxHQ.size || "";

r.insertCell().innerText = x.nhapTQ.toLocaleString('vi-VN');
r.insertCell().innerText = x.nhapHQ.toLocaleString('vi-VN');

let tdTongNhap = r.insertCell();
tdTongNhap.innerText = tongNhap.toLocaleString('vi-VN');
tdTongNhap.style.background = "#f1f2f6";

r.insertCell().innerText = x.xuatTQ.toLocaleString('vi-VN');
r.insertCell().innerText = x.xuatHQ.toLocaleString('vi-VN');

let tdTongXuat = r.insertCell();
tdTongXuat.innerText = tongXuat.toLocaleString('vi-VN');
tdTongXuat.style.background = "#f1f2f6";

r.insertCell().innerText = tonTQ.toLocaleString('vi-VN');
r.insertCell().innerText = tonHQ.toLocaleString('vi-VN');

r.insertCell().innerText = total.toLocaleString('vi-VN');

// cộng tổng
totalSum.boxVN += x.boxVN.size;
totalSum.boxTQ += x.boxTQ.size;
totalSum.boxHQ += x.boxHQ.size;
totalSum.tongNhap += tongNhap;
totalSum.tongXuat += tongXuat;
totalSum.tonTQ += tonTQ;
totalSum.tonHQ += tonHQ;
totalSum.total += total;

});

// ===== DÒNG TỔNG =====

let r = table.insertRow();

r.classList.add("tongRow"); // 👈 thêm dòng này

r.style.fontWeight = "bold";
r.style.background = "#ffeaa7";
r.insertCell().innerText = "TỔNG";
r.insertCell().innerText = "";

r.insertCell().innerText = totalSum.boxVN;
r.insertCell().innerText = totalSum.boxTQ;
r.insertCell().innerText = totalSum.boxHQ;

r.insertCell().innerText = "";
r.insertCell().innerText = "";

let tongNhapCell = r.insertCell();
tongNhapCell.innerText =
totalSum.tongNhap.toLocaleString('vi-VN');

tongNhapCell.style.background="#dfe6e9";

r.insertCell().innerText = "";
r.insertCell().innerText = "";

let tongXuatCell = r.insertCell();
tongXuatCell.innerText =
Object.values(map)
.reduce((a,x)=>a+x.xuatTQ+x.xuatHQ,0)
.toLocaleString('vi-VN');
tongXuatCell.style.background="#dfe6e9";

r.insertCell().innerText = totalSum.tonTQ.toLocaleString('vi-VN');
r.insertCell().innerText = totalSum.tonHQ.toLocaleString('vi-VN');

r.insertCell().innerText = totalSum.total.toLocaleString('vi-VN');

}
// ======================
// LOGOUT
// ======================

function logout(){

location.reload();

}


// ======================
// API
// ======================

const API_URL =
"https://script.google.com/macros/s/AKfycby5O2TPtSJi8meNJ2ilpgS9TKYHa2ZCbygAAAE277GNStGXdlXqn8gO5GyiY8ZMF5hSeQ/exec";

let dataNhap=[];
let dataXuat=[];


// ======================
// TAB
// ======================

function showTab(name,btn){

document.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

document.getElementById(name)
.classList.add("active");

document.querySelectorAll(".tabBtn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

}


// ======================
// LOAD DATA
// ======================

async function loadAllData(){

let loading=
document.getElementById("loading");

loading.style.display="block";

try{

// LOAD NHẬP

let resNhap =
await fetch(API_URL+"?type=NHAP");

dataNhap =
await resNhap.json();

renderTable(
dataNhap,
"tableNhap",
"totalNhap"
);


// LOAD XUẤT

let resXuat =
await fetch(API_URL+"?type=XUAT");

dataXuat =
await resXuat.json();

renderTable(
dataXuat,
"tableXuat",
"totalXuat"
);


// ⭐ QUAN TRỌNG: đặt ở đây

renderTon();
renderBaoCao();

loading.innerText = "✅ Đã load xong";

setTimeout(()=>{
loading.style.display="none";
loading.innerText = "⏳ Đang load dữ liệu...";
},1500);

}
catch(err){

loading.style.display="none";

alert("❌ Lỗi load dữ liệu");

console.log(err);

}

}
function renderTon(){

let tonData = getTonData();

// render bảng tồn
renderTable(tonData,"tableTon","totalTon");

// thống kê
renderStats(tonData);

}
function renderStats(data){

// đếm số dòng mỗi ID
let idCount = {};
data.forEach(row=>{
idCount[row.id] = (idCount[row.id] || 0) + 1;
});

// lấy ID unique
let uniqueMap = new Map();
data.forEach(row=>{
if(!uniqueMap.has(row.id)){
uniqueMap.set(row.id,row);
}
});

let stats = {
CHINA:0,
VIETNAM:0,
KOREA:0,
"MIX SIZE":0
};

// duyệt từng ID
uniqueMap.forEach(row=>{

let note = (row.note || "").toUpperCase().trim();

// 🔥 ƯU TIÊN MIX TRƯỚC
if(idCount[row.id] > 1){
stats["MIX SIZE"]++;
return;
}

// 👇 nếu không phải mix thì mới xét NOTE
if(note === ""){
stats["KOREA"]++;
}
else if(note.includes("CHINA")){
stats["CHINA"]++;
}
else if(note.includes("VIET")){
stats["VIETNAM"]++;
}
else{
stats[note] = (stats[note] || 0) + 1;
}

});

// tổng
let total = Object.values(stats).reduce((a,b)=>a+b,0);

// render
let table = document.getElementById("statTable");
table.innerHTML="";

let header = table.insertRow();
["CHINA","VIETNAM","KOREA","MIX SIZE","TOTAL"].forEach(c=>{
let th=document.createElement("th");
th.innerText=c;
header.appendChild(th);
});

let row = table.insertRow();

row.insertCell().innerText = (stats["CHINA"]||0).toLocaleString('vi-VN');
row.insertCell().innerText = (stats["VIETNAM"]||0).toLocaleString('vi-VN');
row.insertCell().innerText = (stats["KOREA"]||0).toLocaleString('vi-VN');
row.insertCell().innerText = (stats["MIX SIZE"]||0).toLocaleString('vi-VN');
row.insertCell().innerText = total.toLocaleString('vi-VN');

}
// ======================
// RENDER TABLE
// ======================

function renderTable(data,tableID,totalID){

let table=
document.getElementById(tableID);

table.innerHTML="";

if(data.length===0)
return;


// HEADER

let header=table.insertRow();

let cols=[

"STT",
"NOTE",
"ID",
"TÊN",
"MÃ",

"80","90","100",
"110","120","130",
"140","150","160","170",

"KG",
"SỐ THÙNG",
"NGÀY"

];

cols.forEach(c=>{

let th=document.createElement("th");

th.innerText=c;

header.appendChild(th);

});

// DATA

let idCount = {};
data.forEach(row=>{
idCount[row.id] = (idCount[row.id] || 0) + 1;
});

let renderedID = new Set();
let renderedThung = new Set(); 

data.forEach((row,index)=>{

let tr=table.insertRow();

tr.insertCell().innerText=index+1;
tr.insertCell().innerText=row.note || "";

// ID merge
if(!renderedID.has(row.id)){
let tdID = document.createElement("td");
tdID.innerText = row.id;
tdID.rowSpan = idCount[row.id];
tr.appendChild(tdID);
renderedID.add(row.id);
}

tr.insertCell().innerText=row.ten;
tr.insertCell().innerText=row.ma;

// size...
let sizes=row.sizes||{};
["80","90","100","110","120","130","140","150","160","170"]
.forEach(s=>{
let val=sizes[s];
tr.insertCell().innerText=(val==0||val==null)?"":val;
});

tr.insertCell().innerText=row.kg;

// SỐ THÙNG merge
if(!renderedThung.has(row.id)){
let td = document.createElement("td");
td.innerText = 1;
td.rowSpan = idCount[row.id];
tr.appendChild(td);
renderedThung.add(row.id);
}

tr.insertCell().innerText=row.date;

});

// ======================
// TÍNH TỔNG THÙNG
// ======================

let uniqueIDs =
[...new Set(data.map(x => x.id))];

document.getElementById(totalID)
.innerText=
"Tổng thùng: "
+ uniqueIDs.length;

}

function downloadExcel(data, fileName){

if(!data || data.length===0){
alert("Không có dữ liệu!");
return;
}

let rows = data.map((row,index)=>{

let sizes=row.sizes||{};

return {
STT: index+1,
NOTE: row.note || "",
ID: row.id,
TEN: row.ten,
MA: row.ma,

"80": sizes["80"]||"",
"90": sizes["90"]||"",
"100": sizes["100"]||"",
"110": sizes["110"]||"",
"120": sizes["120"]||"",
"130": sizes["130"]||"",
"140": sizes["140"]||"",
"150": sizes["150"]||"",
"160": sizes["160"]||"",
"170": sizes["170"]||"",

KG: row.kg,
NGAY: row.date
};

});

let ws = XLSX.utils.json_to_sheet(rows, {
header: [
"STT","NOTE","ID","TEN","MA",
"80","90","100","110","120","130","140","150","160","170",
"KG","NGAY"
]
});
let wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb, ws, "DATA");

XLSX.writeFile(wb, fileName + ".xlsx");

}
function getTonData(){

let xuatIDs = new Set(dataXuat.map(x=>x.id));

return dataNhap.filter(x=> !xuatIDs.has(x.id));

}
function downloadBaoCaoExcel(){

let table = document.getElementById("tableBaoCao");

if(!table || table.rows.length === 0){
alert("Không có dữ liệu!");
return;
}

let data = [];

// lấy header
let headers = [];
for(let i=0;i<table.rows[0].cells.length;i++){
headers.push(table.rows[0].cells[i].innerText);
}

// lấy data
for(let i=1;i<table.rows.length;i++){

let row = {};
for(let j=0;j<headers.length;j++){
row[headers[j]] = table.rows[i].cells[j].innerText;
}

data.push(row);

}

// tạo excel
let ws = XLSX.utils.json_to_sheet(data, { header: headers });
let wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb, ws, "BAO_CAO");

XLSX.writeFile(wb, "BAO_CAO.xlsx");

}
</script>

</body>
</html>

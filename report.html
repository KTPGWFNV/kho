top:0;

.loading{

left:50%;

background:#fdcb6e;
padding:15px 25px;
border-radius:10px;

}

</style>

<script>
let currentPageNhap = 1;
let currentPageXuat = 1;
let currentPageTon = 1;

const ROWS_PER_PAGE = 50;
// ======================
// USERS LOGIN
// ======================

let users=[

{
username:"admin",
password:"123456"
},

{
username:"user",
password:"123456"
}

];


// ======================
// LOGIN
// ======================

function login(){

let u=
document.getElementById("username").value;

let p=
document.getElementById("password").value;

let found=
users.find(x=>
x.username===u &&
x.password===p
);

if(!found){

alert("Sai tài khoản!");

return;

}

document.getElementById("loginPage")
.style.display="none";

document.getElementById("mainApp")
.style.display="block";

showTab(
"nhap",
document.querySelector(".tabBtn")
);
loadAllData();
}

// ======================
// TÍNH HÀNG TỒN
// ======================

function renderBaoCao(){

let tonData = getTonData();   // tồn
let nhapData = dataNhap;
let xuatData = dataXuat;

let table = document.getElementById("tableBaoCao");
table.innerHTML = "";

// HEADER
let cols = [
"MÃ HÀNG","TÊN HÀNG",
"BOX VN","BOX TQ","BOX HQ",

"NHẬP TQ","NHẬP HQ","TỔNG NHẬP",

"XUẤT TQ","XUẤT HQ","TỔNG XUẤT",

"TỒN TQ","TỒN HQ",
"TỔNG TỒN"
];

let header = table.insertRow();
cols.forEach(c=>{
let th = document.createElement("th");
th.innerText = c;
header.appendChild(th);
});

// ===== MAP =====
let map = {};
let idCount = {};

let keyword =
document.getElementById("searchBaoCao")?.value
.toLowerCase()
.trim() || "";

tonData.forEach(row=>{
  idCount[row.id] = (idCount[row.id] || 0) + 1;
});
function addData(data,type){

data.forEach(row=>{

let key = row.ma;
let note = (row.note||"").toUpperCase();

let qty = Object.values(row.sizes||{})
.reduce((a,b)=>a+(Number(b)||0),0);

if(!map[key]){
map[key] = {
ten: row.ten,

boxVN:new Set(),
boxTQ:new Set(),
boxHQ:new Set(),

nhapTQ:0, nhapHQ:0,
xuatTQ:0, xuatHQ:0
};
}

if(type==="TON"){

  // 🔥 bỏ thùng MIX (ID có nhiều dòng)
  if(idCount[row.id] > 1) return;

  if(note.includes("CHINA")){
    map[key].boxTQ.add(row.id);
  }
  else if(note.includes("VIET")){
    map[key].boxVN.add(row.id);
  }
  else{
    map[key].boxHQ.add(row.id);
  }

}// ===== NHẬP
if(type==="NHAP"){
if(note.includes("CHINA") || note.includes("VIET")){
map[key].nhapTQ += qty;
}else{
map[key].nhapHQ += qty;
}
}

// ===== XUẤT
if(type==="XUAT"){
if(note.includes("CHINA") || note.includes("VIET")){
map[key].xuatTQ += qty;
}else{
map[key].xuatHQ += qty;
}
}

});
}

// chạy
addData(tonData,"TON");
addData(nhapData,"NHAP");
addData(xuatData,"XUAT");

// ===== RENDER =====

let totalSum = {
boxVN:0,
boxTQ:0,
boxHQ:0,

tongNhap:0,
tongXuat:0,

tonTQ:0,
tonHQ:0,
total:0
};

Object.entries(map)
.sort((a,b)=> a[0].localeCompare(b[0], 'vi'))
.forEach(([ma,x])=>{

if(
!ma.toLowerCase().includes(keyword) &&
!x.ten.toLowerCase().includes(keyword)
){
return;
}
// 🔥 bỏ dòng không có thùng
let showHetTon =
document.getElementById("showHetTon")?.checked;

if(
!showHetTon &&
x.boxVN.size === 0 &&
x.boxTQ.size === 0 &&
x.boxHQ.size === 0
){
  return;
}
let tonTQ = x.nhapTQ - x.xuatTQ;
let tonHQ = x.nhapHQ - x.xuatHQ;
let total = tonTQ + tonHQ;
let tongNhap = x.nhapTQ + x.nhapHQ;
let tongXuat = x.xuatTQ + x.xuatHQ;
let r = table.insertRow();

r.insertCell().innerText = ma;
r.insertCell().innerText = x.ten;

r.insertCell().innerText = x.boxVN.size || "";
r.insertCell().innerText = x.boxTQ.size || "";
r.insertCell().innerText = x.boxHQ.size || "";

r.insertCell().innerText = x.nhapTQ.toLocaleString('vi-VN');
r.insertCell().innerText = x.nhapHQ.toLocaleString('vi-VN');

let tdTongNhap = r.insertCell();
tdTongNhap.innerText = tongNhap.toLocaleString('vi-VN');
tdTongNhap.style.background = "#f1f2f6";

r.insertCell().innerText = x.xuatTQ.toLocaleString('vi-VN');
r.insertCell().innerText = x.xuatHQ.toLocaleString('vi-VN');

let tdTongXuat = r.insertCell();
tdTongXuat.innerText = tongXuat.toLocaleString('vi-VN');
tdTongXuat.style.background = "#f1f2f6";

r.insertCell().innerText = tonTQ.toLocaleString('vi-VN');
r.insertCell().innerText = tonHQ.toLocaleString('vi-VN');

r.insertCell().innerText = total.toLocaleString('vi-VN');

// cộng tổng
totalSum.boxVN += x.boxVN.size;
totalSum.boxTQ += x.boxTQ.size;
totalSum.boxHQ += x.boxHQ.size;
totalSum.tongNhap += tongNhap;
totalSum.tongXuat += tongXuat;
totalSum.tonTQ += tonTQ;
totalSum.tonHQ += tonHQ;
totalSum.total += total;

});

// ===== DÒNG TỔNG =====

let r = table.insertRow();

r.classList.add("tongRow"); // 👈 thêm dòng này

r.style.fontWeight = "bold";
r.style.background = "#ffeaa7";
r.insertCell().innerText = "TỔNG";
r.insertCell().innerText = "";

r.insertCell().innerText = totalSum.boxVN;
r.insertCell().innerText = totalSum.boxTQ;
r.insertCell().innerText = totalSum.boxHQ;

r.insertCell().innerText = "";
r.insertCell().innerText = "";

let tongNhapCell = r.insertCell();
tongNhapCell.innerText =
totalSum.tongNhap.toLocaleString('vi-VN');

tongNhapCell.style.background="#dfe6e9";

r.insertCell().innerText = "";
r.insertCell().innerText = "";

let tongXuatCell = r.insertCell();

tongXuatCell.innerText =
totalSum.tongXuat.toLocaleString('vi-VN');

tongXuatCell.style.background="#dfe6e9";

r.insertCell().innerText = totalSum.tonTQ.toLocaleString('vi-VN');
r.insertCell().innerText = totalSum.tonHQ.toLocaleString('vi-VN');

r.insertCell().innerText = totalSum.total.toLocaleString('vi-VN');

}
// ======================
// LOGOUT
// ======================

function logout(){

location.reload();

}


// ======================
// API
// ======================

const API_URL =
"https://script.google.com/macros/s/AKfycby5O2TPtSJi8meNJ2ilpgS9TKYHa2ZCbygAAAE277GNStGXdlXqn8gO5GyiY8ZMF5hSeQ/exec";

let dataNhap=[];
let dataXuat=[];


// ======================
// TAB
// ======================

function showTab(name,btn){

document.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

document.getElementById(name)
.classList.add("active");

document.querySelectorAll(".tabBtn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

}


// ======================
// LOAD DATA
// ======================

async function loadAllData(){

let loading=
document.getElementById("loading");

loading.style.display="block";

try{

// LOAD NHẬP

let resNhap =
await fetch(API_URL+"?type=NHAP");

dataNhap =
await resNhap.json();

renderTable(
dataNhap,
"tableNhap",
"totalNhap",
currentPageNhap
);

renderPagination(
dataNhap,
"paginationNhap",
"tableNhap",
"totalNhap",
"nhap"
);

// LOAD XUẤT

let resXuat =
await fetch(API_URL+"?type=XUAT");

dataXuat =
await resXuat.json();

renderTable(
dataXuat,
"tableXuat",
"totalXuat",
currentPageXuat
);

renderPagination(
dataXuat,
"paginationXuat",
"tableXuat",
"totalXuat",
"xuat"
);


// ⭐ QUAN TRỌNG: đặt ở đây

renderTon();
renderBaoCao();

loading.innerText = "✅ Đã load xong";

setTimeout(()=>{
loading.style.display="none";
loading.innerText = "⏳ Đang load dữ liệu...";
},1500);

}
catch(err){

loading.style.display="none";

alert("❌ Lỗi load dữ liệu");

console.log(err);

}

}
function renderTon(){

let tonData = getTonData();

// 🔍 SEARCH
let keyword =
document.getElementById("searchTon")?.value
.toLowerCase()
.trim() || "";

if(keyword){

tonData = tonData.filter(row =>

(row.id || "")
.toLowerCase()
.includes(keyword)

||

(row.ma || "")
.toLowerCase()
.includes(keyword)

||

(row.ten || "")
.toLowerCase()
.includes(keyword)

);

}

currentPageTon = 1;

// render bảng tồn
renderTable(
tonData,
"tableTon",
"totalTon",
currentPageTon
);

// pagination
renderPagination(
tonData,
"paginationTon",
"tableTon",
"totalTon",
"ton"
);

// thống kê
renderStats(tonData);

}
function renderNhapSearch(){

let keyword =
document.getElementById("searchNhap")?.value
.toLowerCase()
.trim() || "";

let filtered = dataNhap;

if(keyword){

filtered = dataNhap.filter(row =>

if(keyword){

filtered = dataXuat.filter(row =>

||

(row.ma || "")
.toLowerCase()
.includes(keyword)

||

(row.ten || "")
.toLowerCase()
.includes(keyword)

);

}

currentPageXuat = 1;

renderTable(
filtered,
"tableXuat",
"totalXuat",
currentPageXuat
);

renderPagination(
filtered,
"paginationXuat",

"xuat"
);

}
function renderStats(data){

// đếm số dòng mỗi ID
let idCount = {};
data.forEach(row=>{
idCount[row.id] = (idCount[row.id] || 0) + 1;
});

// lấy ID unique
let uniqueMap = new Map();
data.forEach(row=>{
if(!uniqueMap.has(row.id)){
uniqueMap.set(row.id,row);
}
});

let stats = {
CHINA:0,
VIETNAM:0,
KOREA:0,
"MIX SIZE":0
};

// duyệt từng ID
uniqueMap.forEach(row=>{

let note = (row.note || "").toUpperCase().trim();

// 🔥 ƯU TIÊN MIX TRƯỚC
if(idCount[row.id] > 1){
stats["MIX SIZE"]++;
return;
}

// 👇 nếu không phải mix thì mới xét NOTE
if(note === ""){
stats["KOREA"]++;
}
else if(note.includes("CHINA")){
stats["CHINA"]++;
}
else if(note.includes("VIET")){
stats["VIETNAM"]++;
}
else{
stats[note] = (stats[note] || 0) + 1;
}

});

// tổng
let total = Object.values(stats).reduce((a,b)=>a+b,0);

// render
let table = document.getElementById("statTable");
table.innerHTML="";

let header = table.insertRow();
["CHINA","VIETNAM","KOREA","MIX SIZE","TOTAL"].forEach(c=>{
let th=document.createElement("th");
th.innerText=c;
header.appendChild(th);
});

let row = table.insertRow();

row.insertCell().innerText = (stats["CHINA"]||0).toLocaleString('vi-VN');
row.insertCell().innerText = (stats["VIETNAM"]||0).toLocaleString('vi-VN');
row.insertCell().innerText = (stats["KOREA"]||0).toLocaleString('vi-VN');

}
// ======================
// RENDER TABLE
// ======================

function renderTable(data,tableID,totalID,page=1){

let table=
document.getElementById(tableID);

table.innerHTML="";

if(data.length===0)
return;
let groupedData = [];
let currentGroup = [];

for(let i=0;i<data.length;i++){

let row = data[i];

if(
currentGroup.length === 0 ||
currentGroup[0].id === row.id
){
currentGroup.push(row);
}
else{
groupedData.push(currentGroup);
currentGroup = [row];
}

}

if(currentGroup.length){
groupedData.push(currentGroup);
}

// ===== CHIA PAGE KHÔNG CẮT ID =====

let pages = [];
let currentPage = [];
let rowCount = 0;

groupedData.forEach(group=>{

if(rowCount + group.length > ROWS_PER_PAGE){

pages.push(currentPage);

currentPage = [];
rowCount = 0;
}

currentPage.push(...group);
rowCount += group.length;

});

if(currentPage.length){
pages.push(currentPage);
}

let totalPages = pages.length || 1;

if(page < 1){
page = 1;
}

if(page > totalPages){
page = totalPages;
}
let pageData = pages[page-1] || [];
let startIndex = 0;

for(let i=0;i<page-1;i++){
startIndex += pages[i].length;
}
// HEADER

let header=table.insertRow();

let cols=[

"STT",
"NOTE",
"ID",
"TÊN",
"MÃ",

"80","90","100",
"110","120","130",
"140","150","160","170",

"KG",
"SỐ THÙNG",
"NGÀY"

];

cols.forEach(c=>{

let th=document.createElement("th");

th.innerText=c;

header.appendChild(th);

});

// DATA

let idCount = {};
pageData.forEach(row=>{
idCount[row.id] = (idCount[row.id] || 0) + 1;
});
let renderedID = new Set();
let renderedThung = new Set(); 

pageData.forEach((row,index)=>{

let tr=table.insertRow();

tr.insertCell().innerText=startIndex + index + 1;
tr.insertCell().innerText=row.note || "";

// ID merge
if(!renderedID.has(row.id)){
let tdID = document.createElement("td");
tdID.innerText = row.id;
tdID.rowSpan = idCount[row.id];
tr.appendChild(tdID);
renderedID.add(row.id);
}

tr.insertCell().innerText=row.ten;
tr.insertCell().innerText=row.ma;

// size...
let sizes=row.sizes||{};
["80","90","100","110","120","130","140","150","160","170"]
.forEach(s=>{
let val=sizes[s];
tr.insertCell().innerText=(val==0||val==null)?"":val;
});

tr.insertCell().innerText=row.kg;

// SỐ THÙNG merge
if(!renderedThung.has(row.id)){
let td = document.createElement("td");
td.innerText = 1;
td.rowSpan = idCount[row.id];
tr.appendChild(td);
renderedThung.add(row.id);
}

tr.insertCell().innerText=row.date;

});

// ======================
// TÍNH TỔNG THÙNG
// ======================

let uniqueIDs =
[...new Set(data.map(x => x.id))];

document.getElementById(totalID)
.innerText=
"Tổng thùng: "
+ uniqueIDs.length;

}

function downloadExcel(data, fileName){

if(!data || data.length===0){
alert("Không có dữ liệu!");
return;
}

let rows = data.map((row,index)=>{

let sizes=row.sizes||{};

return {
STT: index+1,
NOTE: row.note || "",
ID: row.id,
TEN: row.ten,
MA: row.ma,

"80": sizes["80"]||"",
"90": sizes["90"]||"",
"100": sizes["100"]||"",
"110": sizes["110"]||"",
"120": sizes["120"]||"",
"130": sizes["130"]||"",
"140": sizes["140"]||"",
"150": sizes["150"]||"",
"160": sizes["160"]||"",
"170": sizes["170"]||"",

KG: row.kg,
NGAY: row.date
};

});

let ws = XLSX.utils.json_to_sheet(rows, {
header: [
"STT","NOTE","ID","TEN","MA",
"80","90","100","110","120","130","140","150","160","170",
"KG","NGAY"
]
});
let wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb, ws, "DATA");

XLSX.writeFile(wb, fileName + ".xlsx");

}

function renderPagination(
data,
containerID,
tableID,
totalID,
type
){

let groupedData = [];
let currentGroup = [];

for(let i=0;i<data.length;i++){

let row = data[i];

if(
currentGroup.length === 0 ||
currentGroup[0].id === row.id
){
currentGroup.push(row);
}
else{
groupedData.push(currentGroup);
currentGroup = [row];
}

}

if(currentGroup.length){
groupedData.push(currentGroup);
}

let pages = [];
let currentPageRows = 0;

pages.push([]);

groupedData.forEach(group=>{

if(currentPageRows + group.length > ROWS_PER_PAGE){

pages.push([]);
currentPageRows = 0;
}

pages[pages.length-1].push(...group);

currentPageRows += group.length;

});

let totalPages = pages.length || 1;
let currentPage;

if(type==="nhap"){
currentPage = currentPageNhap;
}

if(type==="xuat"){
currentPage = currentPageXuat;
}

if(type==="ton"){
currentPage = currentPageTon;
}

let div =
document.getElementById(containerID);

div.innerHTML = "";

// PREV
if(currentPage > 1){

let prev = document.createElement("button");

prev.innerText = "<";

prev.onclick = ()=>{

if(type==="nhap"){
currentPageNhap--;
renderTable(data,tableID,totalID,currentPageNhap);
renderPagination(data,containerID,tableID,totalID,type);
}

if(type==="xuat"){
currentPageXuat--;
renderTable(data,tableID,totalID,currentPageXuat);
renderPagination(data,containerID,tableID,totalID,type);
}
if(type==="ton"){
currentPageTon--;
renderTable(data,tableID,totalID,currentPageTon);
renderPagination(data,containerID,tableID,totalID,type);
}
};

div.appendChild(prev);

}

// PAGE
for(
let i=Math.max(1,currentPage-2);
i<=Math.min(totalPages,currentPage+2);
i++
){

let btn = document.createElement("button");

btn.innerText = i;

if(i===currentPage){
btn.classList.add("active");
}

btn.onclick = ()=>{

if(type==="nhap"){
currentPageNhap=i;
renderTable(data,tableID,totalID,i);
}

if(type==="xuat"){
currentPageXuat=i;
renderTable(data,tableID,totalID,i);
}
if(type==="ton"){
currentPageTon=i;
renderTable(data,tableID,totalID,i);
}
renderPagination(
data,
containerID,
tableID,
totalID,
type
);

};

div.appendChild(btn);

}

// NEXT
if(currentPage < totalPages){

let next = document.createElement("button");

next.innerText = ">";

next.onclick = ()=>{

if(type==="nhap"){
currentPageNhap++;
renderTable(data,tableID,totalID,currentPageNhap);
renderPagination(data,containerID,tableID,totalID,type);
}

if(type==="xuat"){
currentPageXuat++;
renderTable(data,tableID,totalID,currentPageXuat);
renderPagination(data,containerID,tableID,totalID,type);
}
if(type==="ton"){
currentPageTon++;
renderTable(data,tableID,totalID,currentPageTon);
renderPagination(data,containerID,tableID,totalID,type);
}
};

div.appendChild(next);

}

}
